<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo TV · AI Trading Lab</title>
  <link rel="stylesheet" href="/static/tv.css">
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="stage" id="stage">
    <div class="offline" id="offline" hidden></div>

    <header class="hud glass">
      <div class="brand">
        <span class="core-dot" aria-hidden="true"></span>
        <div><b>AI TRADING LAB</b><span class="sub">centro de mando</span></div>
      </div>
      <div id="autopilot" class="autopilot"></div>
      <div class="metric">
        <span class="k">Saldo</span>
        <b id="balance">—</b>
        <span class="sub" id="balance-sub"></span>
      </div>
      <div class="metric" id="position"></div>
      <div class="clocks">
        <div><span class="k">Quito</span><b id="clock-quito">--:--</b></div>
        <div><span class="k">UTC</span><b id="clock-utc">--:--</b></div>
        <div><span class="k">Cierre diario en</span><b id="countdown">--:--:--</b></div>
      </div>
    </header>

    <main class="deck">
      <section class="theater">
        <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
        <div class="cube">
          <article class="face glass" id="face" aria-live="polite"></article>
        </div>
      </section>
      <aside class="rail">
        <section class="glass veto" id="veto"></section>
        <section class="glass">
          <h2>Agentes</h2>
          <div id="health" class="health"></div>
        </section>
        <section class="glass feed-card">
          <h2>En vivo <span class="live-dot" aria-hidden="true"></span></h2>
          <ol id="feed" class="feed"></ol>
        </section>
      </aside>
    </main>

    <footer class="glass bottom">
      <div class="thesis" id="thesis"></div>
      <div class="ticker"><div class="ticker-track" id="ticker"></div></div>
    </footer>
  </div>
  <script src="/static/vendor/lightweight-charts.js"></script>
  <script src="/static/tv3d.js"></script>
  <script src="/static/tv.js"></script>
</body>
</html>
